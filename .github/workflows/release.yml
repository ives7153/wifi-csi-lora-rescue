name: EchoGuard Windows Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build both Windows editions
        shell: pwsh
        run: ./scripts/package_releases.ps1
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: echoguard-windows
          path: |
            releases/EchoGuard-v*-windows.zip
            releases/EchoGuard-Mobile-v*-windows.zip
            releases/SHA256SUMS.txt
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            releases/EchoGuard-v*-windows.zip
            releases/EchoGuard-Mobile-v*-windows.zip
            releases/SHA256SUMS.txt
